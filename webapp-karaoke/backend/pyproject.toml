[project]
name = "karaoke-backend"
version = "0.1.0"
description = "Thin API for karaoke web app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "modal>=1.6",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
pipeline = [
    "yt-dlp>=2026.7.4",
    "demucs>=4.0.1,<4.1",
    "torch>=2.6,<2.7",
    "torchaudio>=2.6,<2.7",
    "soundfile>=0.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
